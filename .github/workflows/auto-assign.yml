name: Auto assign

on:
  # フォークからのPRでもアサインできるよう pull_request_target を使う（コードはチェックアウトしない）
  pull_request_target:
    types:
      - opened

permissions:
  pull-requests: write

jobs:
  assign:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.type != 'Bot' && github.event.pull_request.assignees[0] == null
    steps:
      - name: Assign PR author
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: gh pr edit "$PR_NUMBER" --add-assignee "$AUTHOR"
